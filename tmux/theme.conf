# vim: ft=tmux

# --- Kanagawa Palette ---
# Background: transparent
# Status Bar: transparent
# Active Window: #e6c384
# Inactive Window: #dcd7ba
# Selection/Accent: #223249
# Border: #957fb8

# Default statusbar colors (transparent)
set-option -g status-style bg=default,fg=#dcd7ba

# Default window title colors (transparent)
set-window-option -g window-status-style fg=#727169,bg=default,dim

# Active window title colors (transparent)
set-window-option -g window-status-current-style fg=#e6c384,bg=default,bright

# Pane border (transparent)
set-option -g pane-border-style fg=#1f1f28
set-option -g pane-active-border-style fg=#957fb8,bg=default

# Message text
set-option -g message-style bg=#223249,fg=#dcd7ba

# --- Layout Configuration ---

set -g status-left-length "100"
set -g status-right-length "100"

# Left Side: Session name (transparent)
set -g status-left "#[fg=#7e9cd8,bg=default,bold] #S "

# Right Side: Date and Hostname (transparent)
set -g status-right "#[fg=#dcd7ba,bg=default] %Y-%m-%d  %H:%M #[fg=#957fb8,bg=default,bold] #h "

# Window Status Format
setw -g window-status-separator ""

# Inactive Windows (transparent)
setw -g window-status-format "#[fg=#727169,bg=default] #I  #W "

# Active Window (transparent)
setw -g window-status-current-format "#[fg=#e6c384,bg=default,bold] #I  #W "
