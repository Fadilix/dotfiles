# vim: ft=tmux

# --- Kanagawa Palette ---
# Background (Sumi Ink): #16161d
# Status Bar (Sumi Ink 0): #1f1f28
# Active Window (Carp Yellow): #e6c384
# Inactive Window (Fuji White): #dcd7ba
# Selection/Accent (Wave Blue): #223249
# Border (Oni Violet): #957fb8

# Default statusbar colors
set-option -g status-style bg=#16161d,fg=#dcd7ba

# Default window title colors
set-window-option -g window-status-style fg=#727169,bg=#16161d,dim

# Active window title colors
set-window-option -g window-status-current-style fg=#e6c384,bg=#223249,bright

# Pane border
set-option -g pane-border-style fg=#1f1f28
set-option -g pane-active-border-style fg=#957fb8,bg=#16161d

# Message text
set-option -g message-style bg=#223249,fg=#dcd7ba

# --- Layout Configuration ---

set -g status-left-length "100"
set -g status-right-length "100"

# Left Side: Session name with a Crystal Blue accent
set -g status-left "#[fg=#16161d,bg=#7e9cd8,bold] #S #[fg=#7e9cd8,bg=#16161d,nobold,nounderscore,noitalics]"

# Right Side: Date and Hostname using Wave Blue and Oni Violet
set -g status-right "#[fg=#223249,bg=#16161d]#[fg=#dcd7ba,bg=#223249] %Y-%m-%d  %H:%M #[fg=#957fb8,bg=#223249]#[fg=#16161d,bg=#957fb8,bold] #h "

# Window Status Format
setw -g window-status-separator ""

# Inactive Windows
setw -g window-status-format "#[fg=#16161d,bg=#1f1f28,nobold,nounderscore,noitalics]#[fg=#dcd7ba,bg=#1f1f28] #I  #W #[fg=#1f1f28,bg=#16161d,nobold,nounderscore,noitalics]"

# Active Window (The "Pop" of Carp Yellow)
setw -g window-status-current-format "#[fg=#16161d,bg=#e6c384,nobold,nounderscore,noitalics]#[fg=#16161d,bg=#e6c384,bold] #I  #W #[fg=#e6c384,bg=#16161d,nobold,n
