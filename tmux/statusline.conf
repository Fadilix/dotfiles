# vim: ft=tmux

# --- Kanagawa Theme ---
# Background: #1f1f28 (SumiInk2)
# Foreground: #dcd7ba (FujiWhite)
# Selection:  #2d4f67 (WaveBlue1)
# Accent 1:   #7e9cd8 (CrystalBlue)
# Accent 2:   #957fb8 (OniViolet)
# Accent 3:   #76946a (AutumnGreen)
# Warning:    #e6c384 (CarpYellow)

set -g mode-style "fg=#dcd7ba,bg=#2d4f67"

set -g message-style "fg=#dcd7ba,bg=#1f1f28"
set -g message-command-style "fg=#dcd7ba,bg=#1f1f28"

set -g pane-border-style "fg=#1f1f28"
set -g pane-active-border-style "fg=#7e9cd8"

set -g status "on"
set -g status-interval 1
set -g status-justify "left"

set -g status-style "fg=#dcd7ba,bg=#16161d"

set -g status-bg "#16161d"

set -g status-left-length "100"
set -g status-right-length "100"

set -g status-left-style NONE
set -g status-right-style NONE

# Left side: Session Name & User
set -g status-left "#[fg=#16161d,bg=#7e9cd8,bold] #S #[fg=#7e9cd8,bg=#363646,nobold,nounderscore,noitalics]#[fg=#dcd7ba,bg=#363646,bold] #(whoami) #[fg=#363646,bg=#16161d]"

# Right side: Hostname
set -g status-right "#[fg=#1f1f28,bg=#16161d,nobold,nounderscore,noitalics]#[fg=#dcd7ba,bg=#1f1f28] #[fg=#2d4f67,bg=#1f1f28,nobold,nounderscore,noitalics]#[fg=#dcd7ba,bg=#2d4f67] #[fg=#7e9cd8,bg=#2d4f67,nobold,nounderscore,noitalics]#[fg=#16161d,bg=#7e9cd8,bold] #h "

setw -g window-status-activity-style "underscore,fg=#dcd7ba,bg=#16161d"
setw -g window-status-separator ""
setw -g window-status-style "NONE,fg=#87a987,bg=#16161d"

# Inactive Window: Muted Sage Green
setw -g window-status-format '#[fg=#16161d,bg=#16161d]#[default] #I  #{b:pane_current_path} #[fg=#16161d,bg=#16161d,nobold,nounderscore,noitalics]'

# Active Window: Carp Yellow and Sumi Ink
setw -g window-status-current-format '#[fg=#16161d,bg=#e6c384]#[fg=#1f1f28,bg=#e6c384,bold] #I #[fg=#e6c384,bg=#2d4f67]#[fg=#dcd7ba,bg=#2d4f67,bold] #{b:pane_current_path} #[fg=#2d4f67,bg=#16161d,nobold]'
