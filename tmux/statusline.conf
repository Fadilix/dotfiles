# vim: ft=tmux

# --- Kanagawa Theme ---
# Background: transparent
# Foreground: #dcd7ba (FujiWhite)
# Selection:  #2d4f67 (WaveBlue1)
# Accent 1:   #7e9cd8 (CrystalBlue)
# Accent 2:   #957fb8 (OniViolet)
# Accent 3:   #76946a (AutumnGreen)
# Warning:    #e6c384 (CarpYellow)

set -g mode-style "fg=#dcd7ba,bg=#2d4f67"

set -g message-style "fg=#dcd7ba,bg=#2d4f67"
set -g message-command-style "fg=#dcd7ba,bg=#2d4f67"

set -g pane-border-style "fg=#1f1f28"
set -g pane-active-border-style "fg=#7e9cd8"

set -g status "on"
set -g status-interval 1
set -g status-justify "left"

set -g status-style "fg=#dcd7ba,bg=default"

set -g status-bg "default"

set -g status-left-length "100"
set -g status-right-length "100"

set -g status-left-style NONE
set -g status-right-style NONE

# Left side: Session Name & User (transparent backgrounds)
set -g status-left "#[fg=#7e9cd8,bg=default,bold] #S #[fg=#dcd7ba,bg=default,bold] #(whoami) "

# Right side: Hostname (transparent backgrounds)
set -g status-right "#[fg=#dcd7ba,bg=default] %Y-%m-%d #[fg=#dcd7ba,bg=default,nobold,nounderscore,noitalics]#[fg=#7e9cd8,bg=default,bold] #h "

setw -g window-status-activity-style "underscore,fg=#dcd7ba,bg=default"
setw -g window-status-separator ""
setw -g window-status-style "NONE,fg=#87a987,bg=default"

# Inactive Window: transparent background
setw -g window-status-format '#[fg=#727169,bg=default] #I  #{b:pane_current_path} '

# Active Window: transparent background
setw -g window-status-current-format '#[fg=#e6c384,bg=default,bold] #I #[fg=#dcd7ba,bg=default,bold] #{b:pane_current_path} '
