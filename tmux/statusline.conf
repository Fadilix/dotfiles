# vim: ft=tmux

# --- Kanagawa Flow (Fully Transparent - No Vertical Bars) ---

set -g mode-style "fg=#dcd7ba,bg=#2d4f67"
set -g message-style "fg=#dcd7ba,bg=default"
set -g message-command-style "fg=#dcd7ba,bg=default"

set -g pane-border-style "fg=#1f1f28"
set -g pane-active-border-style "fg=#e6c384"

set -g status "on"
set -g status-interval 3
set -g status-justify "left"

set -g status-style "fg=#727169,bg=default"
set -g status-bg "default"

set -g status-left-length "100"
set -g status-right-length "100"

set -g status-left-style NONE
set -g status-right-style NONE

# Left: Prefix Indicator (Icon Only) | User
# Removed vertical bars (│) to cleaner look and fix potential height issues
set -g status-left "#[bold]#{?client_prefix,#[fg=#ff9e3b],#[fg=#7e9cd8]}  #[fg=#dcd7ba,bold] #(whoami) "

# Right: Git Branch | Time
# Removed vertical bars (│)
set -g status-right "#[fg=#98bb6c,bold] #(cd #{pane_current_path}; git rev-parse --abbrev-ref HEAD 2>/dev/null)  #[fg=#dcd7ba] %H:%M  #[fg=#dcd7ba,bold]  #H "

setw -g window-status-activity-style "underscore,fg=#dcd7ba,bg=default"
setw -g window-status-separator ""
setw -g window-status-style "NONE,fg=#727169,bg=default"

# Inactive Window: Minimalist Gray
setw -g window-status-format "#[fg=#727169,bg=default]  #I #{b:pane_current_path}  "

# Active Window: Bold Gold Text
setw -g window-status-current-style "fg=#e6c384,bg=default,bold"
setw -g window-status-current-format "#[fg=#e6c384,bg=default,bold]  #I  #{b:pane_current_path}  "
