# ----------------------------------------------------- 
# Hyprland 0.53.0
# https://github.com/Fadilix
# ----------------------------------------------------- 
# 
windowrule = match:class ^(main-dropterm)$, float on

# ----------------------------------------------------- 
# IDLE INHIBIT
# ----------------------------------------------------- 
windowrule = match:class .*, idle_inhibit fullscreen
windowrule = match:title .*, idle_inhibit fullscreen
windowrule = match:fullscreen_state_internal 2, idle_inhibit fullscreen

# ----------------------------------------------------- 
# WORKSPACE ASSIGNMENTS
# ----------------------------------------------------- 
windowrule = match:class ^([Vv]esktop)$, workspace 7
windowrule = match:class ^([Ff]erdium)$, workspace 7
windowrule = match:class ^(virt-manager)$, workspace 6 silent
windowrule = match:class ^([Aa]udacious)$, workspace 9 silent

# ----------------------------------------------------- 
# FLOATING RULES
# ----------------------------------------------------- 
# Format: match:[prop] [RegEx], [Effect] [on]
windowrule = match:class ([Zz]oom|onedriver|onedriver-launcher), float on
windowrule = match:class ([Tt]hunar), match:title (File Operation Progress|Confirm to replace files), float on
windowrule = match:class (xdg-desktop-portal-gtk|org.gnome.Calculator|yad|wihotspot-gui|evince), float on
windowrule = match:class ^([Rr]ofi)$, float on
windowrule = match:class ^(pavucontrol|org.pulseaudio.pavucontrol|nwg-look|qt5ct|qt6ct|mpv)$, float on
windowrule = match:class ^(nm-applet|nm-connection-editor|blueman-manager|gnome-system-monitor|org.gnome.SystemMonitor)$, float on
windowrule = match:class ^(file-roller|org.gnome.FileRoller|baobab|org.gnome.baobab|qualculate-gtk|whatsapp-for-linux)$, float on

# ----------------------------------------------------- 
# OPACITY RULES
# ----------------------------------------------------- 
windowrule = match:class ^([Rr]ofi)$, opacity 0.9 0.6
windowrule = match:class ^(Brave-browser.*|spotify|microsoft-edge.*|google-chrome.*)$, opacity 0.9 0.7
windowrule = match:class ^([Tt]hunar)$, opacity 0.9 0.8
windowrule = match:class ^(VSCode|code-url-handler)$, opacity 0.9 0.8

# ----------------------------------------------------- 
# JETBRAINS FIXES (Block Syntax)
# ----------------------------------------------------- 
# Blocks require a name and use = for assignments
windowrule {
    name = jetbrains-toolbox-fix
    match:class = ^jetbrains-toolbox$
    match:float = yes
    no_initial_focus = on
}

windowrule {
    name = jetbrains-ide-center
    match:class = ^jetbrains-.*
    match:title = ^$
    match:initial_title = ^$
    match:float = yes
    no_initial_focus = on
    center = on
}

# ----------------------------------------------------- 
# SIZE RULES
# ----------------------------------------------------- 
windowrule = match:class ^(gnome-system-monitor|org.gnome.SystemMonitor)$, size 70% 70%
windowrule = match:class ^(xdg-desktop-portal-gtk)$, size 70% 70%
windowrule = match:class ^(file-roller|org.gnome.FileRoller)$, size 60% 70%

# ----------------------------------------------------- 
# LAYER RULES
# ----------------------------------------------------- 
layerrule {
    name = overview-style
    match:namespace = overview
    blur = on
    ignore_alpha = 0
}

# ----------------------------------------------------- 
# PICTURE-IN-PICTURE (Block Syntax)
# ----------------------------------------------------- 
windowrule {
    name = pip-rules
    match:title = ^(Picture-in-Picture)$
    float = on
    pin = on
    size = 25% 25%
    move = 72% 7%
}
