# Jetbrains related rules
# windowrulev2 = opacity 0.9 0.8, class:^(jetbrains-.+)$ # JetBrains IDEs
# input.follow_mouse = 2
windowrule {
  name = windowrule-44
  no_initial_focus = on
  match:class = jetbrains-toolbox
  match:float = 1
}

windowrule {
  name = windowrule-45
  no_initial_focus = on
  center = on
  match:class = (jetbrains-)(.*)
  match:title = ^$
  match:initial_title = ^$
  match:float = 1
}

# windowrulev2=center, class:(jetbrains-)(.*), initialTitle:(.+), floating:1
windowrule {
  name = windowrule-46
  no_initial_focus = on
  match:class = (jetbrains-)(.*)
  match:float = 1
}


