# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# Thanks to https://itsohen.github.io/hyprrulefix/ for the converter
# Compatible with Hyprland 0.53

#windowrule = noblur,gamescope
#windowrule = fullscreen,gamescope
#windowrule = workspace 6 silent,^(gamescope)$

# windowrule center
# windowrule = float, code
# windowrule = center,^(pavucontrol|org.pulseaudio.pavucontrol)
# windowrule = center,^([Ww]hatsapp-for-linux)$
# windowrule = center,^([Ff]erdium)$

# WINDOWRULE v2
windowrule {
  name = windowrule-1
  idle_inhibit = fullscreen
  match:class = ^(*)$
}

windowrule {
  name = windowrule-2
  idle_inhibit = fullscreen
  match:title = ^(*)$
}

windowrule {
  name = windowrule-3
  idle_inhibit = fullscreen
  match:fullscreen = 1
}


# windowrule v2 move to workspace
windowrule {
  name = windowrule-4
  workspace = 7
  match:class = ^([Vv]esktop)$
}

windowrule {
  name = windowrule-5
  workspace = 7
  float = on
  opacity = 0.9 0.7
  size = (monitor_w*0.6) (monitor_h*0.7)
  match:class = ^([Ff]erdium)$
}


# windowrule v2 move to workspace (silent)
windowrule {
  name = windowrule-6
  workspace = 6 silent
  match:class = ^(virt-manager)$
}

windowrule {
  name = windowrule-7
  workspace = 9 silent
  opacity = 0.9 0.7
  match:class = ^([Aa]udacious)$
}


